# Sync Manifest — the transportable architecture surface.
#
# Lists which parts of this repo are portable machinery (synced to satellites) vs
# repo-specific content (kept local). Edit this file, not the sync script, to change
# what transports.
#
# Format:
#   portable_dirs:   directories copied recursively into the target (overwrite).
#   portable_skills: skill slugs copied from .devops/skills/ into the target's
#                    .devops/skills/ (overwrite that skill only, never the whole folder).
#   portable_files:    standalone files copied verbatim into the target.
#   excluded_skills:   skill slugs NOT synced. Portable skills are DERIVED: every folder
#                      in .devops/skills minus this list. Adding a skill needs no manifest
#                      edit; only exclusions do.
#   machinery-version: integer bumped whenever agents/rules/scripts/templates change as a
#                      set; drives UPGRADE vs DRIFT for non-skill items in -Check.
#
# Verification is hardcoded in scripts/sync-architecture.ps1 (prefix regen, utf8, wiki_lint)
# — there is no verify_commands key; the script is the single source of truth.

machinery-version: 1

portable_dirs:
  - .wiki/rules
  - .devops/rules
  - .devops/agents
  - .devops/templates

portable_files:
  - scripts/check-parcel-prefix.ps1
  - scripts/check-utf8-agents.ps1
  - scripts/sync-architecture.ps1
  - scripts/pull-architecture.ps1
  - scripts/wiki_lint.py

excluded_skills: []
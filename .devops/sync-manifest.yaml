# Sync Manifest — the transportable architecture surface.
#
# Lists which parts of this repo are portable machinery (synced to satellites) vs
# repo-specific content (kept local). Edit this file, not the sync script, to change
# what transports.
#
# Format:
#   portable_dirs:   directories copied recursively into the target (overwrite).
#   portable_skills: skill slugs copied from .devops/skills/ into the target's
#                    .devops/skills/ (overwrite that skill only, never the whole folder).
#   portable_files:  standalone files copied verbatim into the target.
#   prune_files:     files deleted from the target if present (files retired upstream,
#                    e.g. renamed/removed runbooks). Relative to repo root.
#   prune_dirs:      directories deleted from the target if present, recursively (folders
#                    retired upstream). Portable skills are DERIVED from .devops/skills
#                    minus excluded_skills, so a retired skill folder is never compared,
#                    never copied and never deleted without this key — every already-synced
#                    satellite would keep a silent orphan. Do NOT express a retirement via
#                    excluded_skills: exclusion narrows fresh syncs and yields no verdict.
#   excluded_skills:   skill slugs NOT synced. Portable skills are DERIVED: every folder
#                      in .devops/skills minus this list. Adding a skill needs no manifest
#                      edit; only exclusions do.
#   machinery-version: the TRANSPORT SET version - one honest number, template-owned, stamped
#                      into the target by sync. Format major.minor.patch (dotted-tolerant: an
#                      integer is also accepted while the two-release migration is staged).
#                      Bump rule, read mechanically from the diff: patch = routine improvement
#                      (default); minor = a new capability surface (a path with no prior
#                      registry/manifest row); major = operator-contract change - the diff
#                      intersects the reserved-surfaces set (`.devops/rules/plan-lifecycle.md`
#                      § Claim Protocol -> Reserved Surfaces & the Lane Model; cited, never
#                      re-listed here). Ceremony attaches to the level: patch = a one-line
#                      release row, no CHANGELOG entry, no tag; major = full row + CHANGELOG +
#                      tag. A major is a MANDATORY pull milestone for every satellite - the
#                      downhill half of the feedback loop. The value IS the release-log Version
#                      column: one number, one writer (the wrap-up, per batch), one check
#                      (`.github/workflows/validate.yml`).
#                      Ordering-aware: -Check reports behind as UPGRADE, ahead as AHEAD and a
#                      lineage shape crossing as MIGRATION; the last two halt-and-reconcile, so
#                      a pull never silently rewinds a counter the target earned.
#                      MIGRATION STATUS: release A (this release) keeps an INTEGER value - the
#                      script that runs during a satellite pull is the satellite's own (old)
#                      one, whose (\d+) stamp would corrupt a dotted value into 1.0.73.0.73.
#                      Release B flips this line to 1.0.73 (major 1; patch 73 continues the
#                      count) - a one-line change, because every reader is already
#                      dotted-tolerant and a shape crossing halts instead of misreading.
#
# Verification is hardcoded in scripts/sync-architecture.ps1 (prefix regen, utf8, wiki_lint)
# — there is no verify_commands key; the script is the single source of truth.

machinery-version: 73

portable_dirs:
  - .wiki/rules
  - .devops/rules
  - .devops/agents
  - .devops/templates
  - .vscode

portable_files:
  - scripts/check-parcel-prefix.ps1
  - scripts/check-utf8-agents.ps1
  - scripts/sync-architecture.ps1
  - scripts/pull-architecture.ps1
  - scripts/wiki_lint.py
  - scripts/wiki_claims.py
  - scripts/wiki_lint_core.py
  - scripts/wiki_lint_checks.py
  # The sync engine's dot-sourced modules. A partial split ships a satellite a broken
  # engine, so every module travels with the entry script; -SelfTest asserts this mirror.
  - scripts/lib/sync-manifest.ps1
  - scripts/lib/sync-bindings.ps1
  - scripts/lib/sync-prune.ps1
  - scripts/lib/sync-prefix.ps1
  - scripts/lib/sync-verify.ps1
  - scripts/spaghetti-monster-scan.cjs
  # The batch eligibility predicate, executable. `parcel-sprint` (portable) and the
  # `sprint-run` skill call it as their authority, so it must ride with them; the
  # fixture test beside it (`scripts/tests/`) stays local — `validate.yml` is not a
  # portable file, so a satellite would ship a test nothing runs.
  - scripts/sprint_eligible.py
  - scripts/rule_fanout.py
  - .github/workflows/wiki-refresh.yml
  # The canonical plan scaffold. Named by the shared prefix (.opencode/plans/base-context.md)
  # and by five shipped skills, so it must ride with them; the only file under .devops/plans/
  # that transports (active plans are repo-specific).
  - .devops/plans/template-plan.md

# Retired portable files. The parcel-* / wiki-verifier runbooks went in the VS Code
# .agent.md migration (v0.3.2); parcel-compactor.md was retired earlier (2026-08-22)
# while .devops/agents/ was already portable, so any satellite that materialised it
# since then keeps an orphan unless it is listed here.
prune_files:
  - .devops/agents/parcel-orchestrator.md
  - .devops/agents/parcel-context-hunter.md
  - .devops/agents/parcel-high-visionary.md
  - .devops/agents/parcel-smooth-operator.md
  - .devops/agents/parcel-grumpy-architect.md
  - .devops/agents/parcel-code-surgeon.md
  - .devops/agents/parcel-phase3-answerer.md
  - .devops/agents/parcel-compactor.md
  - .devops/agents/wiki-verifier.md
  # Retired in T1-E3.05 (machinery 44): the selectable parcel-fast orchestrator was removed;
  # the fast lane is subagent-only (`parcel-sprint` -> `ptp-parcel-fast`). This entry is
  # load-bearing, not cosmetic: a satellite that already synced keeps the orphan file while
  # its Model Registry row is gone, so that satellite's own check-parcel-prefix.ps1 fails
  # "registry key has no agent file" / "no Model Registry row" and its pull exits 1.
  - .devops/agents/parcel-fast.agent.md
  # Retired in T1-E4.01 (machinery 56): the three scripts left the portable surface.
  # The coverage gate MOVED into wiki_claims.py (a satellite that still carries the old
  # script would run a gate nothing maintains); the OKF bundle and the static visualizer
  # had no consumer left.
  - scripts/wiki_coverage_check.py
  - scripts/wiki_okf.py
  - scripts/wiki_visualize.py
  # Retired in the machinery-59 hygiene cull (commit 6fe6e5f): an orphan reference
  # inside a portable SKILL. The first prune_files path under a portable skill - the
  # parent-dir mask covers skills, so it reports PRUNE, never a false skill DRIFT.
  - .devops/skills/wiki-bootstrap/references/qa-14-testing-standards.md

# Retired portable DIRECTORIES (folders retired upstream, deleted recursively). Portable
# skills are derived from .devops/skills minus excluded_skills, so a retired skill folder
# is never compared, never copied and never deleted: without this key every already-synced
# satellite keeps the folder as a silent orphan whose @slug references are already gone.
# Added in T1-E4.01 (W8.1) with the four skill retirements below.
prune_dirs:
  - .devops/skills/wiki-assessment
  - .devops/skills/caveman
  - .devops/skills/app-vision-north-star
  - .devops/skills/pre-deployment-vibe-auditor

excluded_skills: []
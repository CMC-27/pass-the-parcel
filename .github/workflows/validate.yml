name: Validate Machinery

# Deterministic gate for the template's own invariants. Mirrors the pre-push
# checklist in AGENTS.md (Rule 9) so drift is caught on push, not by satellites.
# Runs on ubuntu-latest with LF checkout — .gitattributes pins eol=lf, so the
# PREFIX-LOCKED byte-comparison is valid here without CRLF normalization.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parcel prefix integrity (PREFIX-LOCKED contract)
        shell: pwsh
        run: ./scripts/check-parcel-prefix.ps1

      - name: UTF-8 mojibake guard (agent runbooks)
        shell: pwsh
        run: ./scripts/check-utf8-agents.ps1

      - name: Wiki lint (links, anchors, frontmatter)
        run: python scripts/wiki_lint.py --quiet

      - name: Wiki coverage gate (graceful no-op until src/ exists)
        run: python scripts/wiki_claims.py coverage

      - name: Claims drift check (grounded evidence)
        run: python scripts/wiki_claims.py check

      - name: Wiki frontmatter parses as YAML
        run: |
          pip install --quiet pyyaml
          python - <<'EOF'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('.wiki/**/*.md', recursive=True)):
              txt = open(f, encoding='utf-8').read()
              if not txt.startswith('---'):
                  continue
              try:
                  yaml.safe_load(txt.split('---', 2)[1])
              except yaml.YAMLError as e:
                  print(f'INVALID-YAML {f}: {e}')
                  bad += 1
          if bad:
              sys.exit(1)
          print('Wiki frontmatter: every .wiki/**/*.md frontmatter block parses as YAML')
          EOF

      - name: JSON config parses (tracked JSON only)
        run: |
          # .opencode/package.json is gitignored local runtime — never assert untracked files.
          python -c "import json; json.load(open('opencode.json', encoding='utf-8'))"
          python -c "import json; json.load(open('.devops/templates/opencode.template.json', encoding='utf-8'))"

      - name: SelfTest sync engine (transport contract)
        shell: pwsh
        run: ./scripts/sync-architecture.ps1 -SelfTest

      - name: Sprint eligibility predicate (fixture tests, temp trees only)
        run: python scripts/tests/test_sprint_eligible.py

      - name: Encoding guard fixtures (temp trees only)
        # Drives the real scripts/check-utf8-agents.ps1 over planted marker/legit byte
        # payloads; skips itself where no PowerShell host exists. Guards a GATE, so it
        # is wired here. The sibling test_rule_fanout.py stays deliberately UNGATED —
        # the surface budget is report-only by design (never a second gate over the gates).
        run: python scripts/tests/test_check_utf8_agents.py

      - name: Coverage gate fixtures (temp trees only)
        run: python scripts/tests/test_wiki_claims_coverage.py

      - name: Machinery version discipline (manifest vs version-history)
        run: |
          python - <<'EOF'
          import re, sys
          from pathlib import Path
          manifest = Path('.devops/sync-manifest.yaml').read_text(encoding='utf-8')
          m = re.search(r'^machinery-version:\s*(\d+)\s*$', manifest, re.MULTILINE)
          if not m:
              sys.exit('machinery-version missing from .devops/sync-manifest.yaml')
          mv = int(m.group(1))
          hist = Path('.devops/logs/version-history.md').read_text(encoding='utf-8')
          if f'machinery-version: {mv}' not in hist:
              sys.exit(f'FAIL: version-history.md records no release row for machinery-version {mv}')
          print(f'OK: machinery-version {mv} is recorded in version-history.md')
          EOF
